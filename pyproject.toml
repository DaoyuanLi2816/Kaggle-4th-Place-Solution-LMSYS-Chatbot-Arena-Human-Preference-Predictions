[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pairjudge"
version = "0.2.0"
description = "Train and serve pairwise LLM judges (A/B/tie) with budget-aware multi-turn packing and position-bias correction"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Daoyuan Li", email = "lidaoyuan2816@gmail.com" }]
keywords = [
    "llm-as-judge",
    "reward-model",
    "preference-learning",
    "rlhf",
    "chatbot-arena",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy",
    "pandas",
    "pyyaml",
]

[project.optional-dependencies]
# Inference: load a trained judge and predict preferences.
# accelerate is required by the default device_map="auto" load path.
judge = ["torch", "transformers>=4.46", "accelerate"]
# Training: fine-tune a judge with LoRA on your own preference data.
train = [
    "torch",
    "transformers>=4.46",
    "peft",
    "datasets",
    "accelerate",
    "scikit-learn",
]
test = [
    "pytest",
    "pytest-cov",
    "ruff",
    "torch",
    "transformers>=4.46",
    "scikit-learn",
]

[project.urls]
Homepage = "https://github.com/DaoyuanLi2816/pairjudge"
Repository = "https://github.com/DaoyuanLi2816/pairjudge"
Issues = "https://github.com/DaoyuanLi2816/pairjudge/issues"
Changelog = "https://github.com/DaoyuanLi2816/pairjudge/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 88
exclude = ["competition", "tests/reference_impl.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["pairjudge"]

[tool.coverage.report]
show_missing = true
