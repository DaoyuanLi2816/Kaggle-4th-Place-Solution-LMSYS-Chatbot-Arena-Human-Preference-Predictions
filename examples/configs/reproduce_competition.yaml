# Phase-1 configuration of the 4th-place solution, expressed in pairjudge.
# Requires 4x A100 40G (~10 h). gemma-2-9b-it is gated on the Hugging Face
# Hub — accept the license and `huggingface-cli login` first.
#
# The original scripts and exact configs are preserved under competition/;
# this file is the library-native equivalent. Phase 2 (pseudo-label
# distillation) additionally uses pairjudge.pseudo_label and label_mode: soft.

train_path: ./input/lmsys-chatbot-arena/train.csv
label_mode: hard

model_name: google/gemma-2-9b-it
max_length: 2048
disable_attn_logit_softcapping: true

use_lora: true
lora_r: 64
lora_alpha: 16
lora_dropout: 0.05

output_dir: ./output/judge-gemma2-9b
n_epochs: 1.0
lr: 0.0002
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
warmup_steps: 20
bf16: true
optim: adamw_8bit
